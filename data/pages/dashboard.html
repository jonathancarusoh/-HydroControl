<div class="container-fluid">

    <div class="row mb-4">

        <div class="col">

            <h2 class="fw-bold">
                Dashboard
            </h2>

            <small class="text-secondary">
                Estado general del sistema
            </small>

        </div>

    </div>

    <section class="dashboard-clock-strip">

        <div class="dashboard-clock-main">
            <span class="dashboard-clock-icon">
                <i class="bi bi-clock"></i>
            </span>

            <div class="dashboard-clock-copy">
                <small>Hora del HydroControl</small>
                <div class="dashboard-clock-value" id="dashboardClock">--:--:--</div>
                <div class="dashboard-clock-date" id="dashboardClockDate">
                    Hora no configurada
                </div>
            </div>
        </div>

        <div class="dashboard-light-state">
            <small>Programación de luz</small>
            <strong id="dashboardLightState" data-state="unknown">
                <i class="bi bi-lightbulb"></i>
                Sin información
            </strong>
            <span class="dashboard-light-next" id="dashboardLightNext">---</span>
        </div>

    </section>

    <div class="row g-4">

        <div class="col-xl-3 col-lg-6">

            <div class="card sensor-card h-100">

                <div class="card-body">

                    <h6>🧪 pH</h6>

                    <h1 id="phValue">--</h1>

                    <span
                    id="phStatus"
                    class="badge bg-success">

                    ESTABLE

                    </span>

                </div>

            </div>

        </div>

        <div class="col-xl-3 col-lg-6">

            <div class="card sensor-card h-100">

                <div class="card-body">

                    <h6>💧 EC</h6>

                    <h1 id="ecValue">--</h1>

                    <span
                    class="badge bg-success">

                    NORMAL

                    </span>

                </div>

            </div>

        </div>

        <div class="col-xl-3 col-lg-6">

            <div class="card sensor-card h-100">

                <div class="card-body">

                    <h6>🌡 Agua</h6>

                    <h1 id="waterTemp">

                    --

                    </h1>

                </div>

            </div>

        </div>

        <div class="col-xl-3 col-lg-6">

            <div class="card sensor-card h-100">

                <div class="card-body">

                    <h6>💨 Humedad</h6>

                    <h1 id="humidity">

                    --

                    </h1>

                </div>

            </div>

        </div>

    </div>

</div>
