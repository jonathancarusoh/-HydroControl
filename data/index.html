<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#1a1d21">

    <title>HydroControl</title>

    <link
        href="css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">
</head>

<body>

    <!-- BARRA SUPERIOR PARA CELULAR -->

    <header class="mobile-header">

        <button
            type="button"
            class="mobile-menu-button"
            id="mobileMenuButton"
            aria-label="Abrir menú">

            <i class="bi bi-list"></i>

        </button>

        <div class="mobile-logo">
            🌱 HydroControl
        </div>

    </header>

    <!-- FONDO OSCURO CUANDO SE ABRE EL MENÚ -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay">
    </div>

    <div class="wrapper">

        <!-- MENÚ LATERAL -->

        <aside
            class="sidebar"
            id="sidebar">

            <div class="sidebar-header">

                <h3 class="logo">
                    🌱 HydroControl
                </h3>

                <button
                    type="button"
                    class="sidebar-close-button"
                    id="sidebarCloseButton"
                    aria-label="Cerrar menú">

                    <i class="bi bi-x-lg"></i>

                </button>

            </div>

            <ul>

                <li
                    data-page="dashboard"
                    class="active">

                    <i class="bi bi-house"></i>
                    <span>Dashboard</span>

                </li>

                <li data-page="ph">

                    <i class="bi bi-droplet-half"></i>
                    <span>pH</span>

                </li>

                <li data-page="ec">

                    <i class="bi bi-bezier2"></i>
                    <span>EC</span>

                </li>

                <li data-page="sensors">

                    <i class="bi bi-thermometer-half"></i>
                    <span>Sensores</span>

                </li>

                <li data-page="history">

                    <i class="bi bi-graph-up"></i>
                    <span>Historial</span>

                </li>

                <li data-page="settings">

                    <i class="bi bi-gear"></i>
                    <span>Configuración</span>

                </li>

                <li data-page="wifi">

                    <i class="bi bi-wifi"></i>
                    <span>WiFi</span>

                </li>

            </ul>

        </aside>

        <!-- CONTENIDO PRINCIPAL -->

        <main class="content">

            <div id="page">
            </div>

        </main>

    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/ph.js"></script>
    <script src="js/wifi.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
